name: Build Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows Executable
        shell: pwsh
        run: |
            pyinstaller `
            --onefile `
            --add-data "songs_app/infra;songs_app/infra" `
            --icon="songs_app/resources/music.ico" `
            --distpath build_win `
            --workpath build_win/build_temp `
            songs_app/master.py


      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songs
          path: build_win/master.exe

  build_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS Executable
        run: |
          pyinstaller --onefile \
            --add-data "songs_app/infra:songs_app/infra" \
            --icon="songs_app/resources/music.icns" \
            --distpath build_macOS \
            --workpath build_macOS/build_temp \
            songs_app/master.py

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: build_macOS/